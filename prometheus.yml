# Reference Prometheus config for running the exporter natively on the host
# (python main.py / no Docker), scraping localhost targets. For the Docker
# Compose stack (docker-compose.yml), use docker/prometheus.yml instead,
# which addresses containers by service name on the compose network.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: "local"
    host: "this-computer"

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "local-agent"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8001"
        labels:
          instance: "native-host"
