[project]
name = "sys-exp"
version = "1.1.0"
description = "Cross-platform host metrics exporter for Prometheus/Grafana, with an IsolationForest anomaly detector."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501", # line length is handled case-by-case; tables/gauges favor readability over strict wrapping
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["^tests/", "^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["main", "metrics", "net_observer", "config"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]