name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy main.py metrics.py net_observer.py config.py

      - name: Pytest with coverage
        run: pytest --cov --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build exporter image
        run: docker build -t sys-exp-exporter:ci .

      - name: Smoke test image
        run: |
          docker run -d --name sys-exp-smoke -p 8000:8000 sys-exp-exporter:ci
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "Exporter did not become healthy in time" >&2
          docker logs sys-exp-smoke
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f sys-exp-smoke || true
